<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多人聊天室 · 在线版</title>
<meta name="description" content="免费在线多人聊天室，无需安装，打开网页即可多人实时聊天，支持管理员、私聊、禁言、公告。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(135deg, #dfe9f3, #ffffff);
    height: 100vh; overflow: hidden;
  }

  /* ---------- 登录页 ---------- */
  #loginPage { height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: #fff; border-radius: 16px; padding: 38px 36px;
    box-shadow: 0 10px 40px rgba(30, 80, 160, .15); width: 370px;
  }
  .login-card h1 { font-size: 22px; text-align: center; color: #1a73e8; margin-bottom: 6px; }
  .login-card p.sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
  .login-card label { display: block; font-size: 13px; color: #555; margin: 12px 0 6px; }
  .login-card input {
    width: 100%; padding: 11px 12px; border: 1px solid #d5dbe3; border-radius: 8px;
    font-size: 14px; outline: none; transition: border .2s;
  }
  .login-card input:focus { border-color: #1a73e8; }
  .login-card button {
    width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 8px;
    background: #1a73e8; color: #fff; font-size: 15px; cursor: pointer; transition: background .2s;
  }
  .login-card button:hover { background: #1557b0; }
  .login-card button:disabled { background: #9bb8dd; cursor: default; }
  .login-card .tip { font-size: 12px; color: #aaa; margin-top: 14px; text-align: center; line-height: 1.7; }
  #loginError { color: #e53935; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }

  /* ---------- 聊天页 ---------- */
  #chatPage { display: none; height: 100vh; }
  .layout { display: flex; height: 100%; }

  .sidebar { width: 240px; background: #2e3e50; color: #cfd8e3; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar .brand { padding: 18px 16px; font-size: 16px; font-weight: bold; color: #fff; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sidebar .brand small { display: block; font-weight: normal; font-size: 12px; color: #8fa4bb; margin-top: 4px; }
  .sidebar .sec-title { padding: 14px 16px 6px; font-size: 12px; color: #8fa4bb; }
  .user-list { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
  .user-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px;
    cursor: pointer; font-size: 14px; transition: background .15s;
  }
  .user-item:hover { background: rgba(255,255,255,.08); }
  .user-item.selected { background: rgba(26,115,232,.35); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; background: #607d8b;
  }
  .user-item .u-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; }
  .badge.admin-b { background: #e67e22; color: #fff; }
  .badge.mute-b  { background: #78909c; color: #fff; }
  .badge.me-b    { background: #1a73e8; color: #fff; }
  .sidebar .foot { padding: 10px 16px; font-size: 11px; color: #7f93a8; border-top: 1px solid rgba(255,255,255,.08); line-height: 1.6; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #f5f6f7; }
  .chat-header { background: #fff; padding: 14px 20px; border-bottom: 1px solid #e3e6ea; display: flex; align-items: center; gap: 12px; }
  .chat-header h2 { font-size: 16px; color: #333; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .role-chip { font-size: 12px; padding: 3px 10px; border-radius: 10px; }
  .role-chip.admin { background: #fff3e0; color: #e67e22; }
  .role-chip.user  { background: #e3f2fd; color: #1a73e8; }
  .conn { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #888; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; }
  .dot.on { background: #43a047; }
  .dot.off { background: #e53935; }
  .btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-ghost { background: #eef1f5; color: #555; }
  .btn-blue  { background: #1a73e8; color: #fff; }
  .btn-orange{ background: #e67e22; color: #fff; }
  .btn-red   { background: #e53935; color: #fff; }
  .btn-green { background: #43a047; color: #fff; }

  #prvBar { display: none; background: #fff8e1; border-bottom: 1px solid #ffe082; padding: 8px 20px; font-size: 13px; color: #8d6e00; align-items: center; gap: 10px; }
  #prvBar button { padding: 3px 10px; font-size: 12px; }

  .messages { flex: 1; overflow-y: auto; padding: 18px 24px; }
  .msg { display: flex; margin-bottom: 14px; gap: 10px; }
  .msg.mine { flex-direction: row-reverse; }
  .msg .m-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px; background: #607d8b;
  }
  .msg .m-body { max-width: 62%; }
  .msg .m-meta { font-size: 11px; color: #999; margin-bottom: 4px; }
  .msg.mine .m-meta { text-align: right; }
  .msg .m-bubble {
    background: #fff; border-radius: 10px; padding: 9px 13px; font-size: 14px;
    color: #333; line-height: 1.5; word-break: break-all; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .msg.mine .m-bubble { background: #1a73e8; color: #fff; }
  .msg .m-bubble.prv  { background: #f3e5f5; color: #6a1b9a; }
  .msg.mine .m-bubble.prv { background: #8e24aa; color: #fff; }
  .sys-line { text-align: center; margin: 10px 0; }
  .sys-line span {
    display: inline-block; background: #e8eaed; color: #78909c; font-size: 12px;
    padding: 4px 14px; border-radius: 12px;
  }
  .sys-line.announce span { background: #fff3e0; color: #e67e22; font-weight: bold; }

  #adminBar { display: none; padding: 8px 24px; background: #fff; border-top: 1px solid #e3e6ea; font-size: 13px; color: #555; align-items: center; gap: 10px; }

  .input-bar { background: #fff; border-top: 1px solid #e3e6ea; padding: 12px 20px; display: flex; gap: 10px; }
  .input-bar input { flex: 1; padding: 11px 14px; border: 1px solid #d5dbe3; border-radius: 8px; font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: #1a73e8; }
  .input-bar input:disabled { background: #f5f5f5; color: #999; }
  .input-bar button { padding: 11px 26px; font-size: 14px; }

  @media (max-width: 700px) { .sidebar { width: 170px; } .msg .m-body { max-width: 80%; } }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-card">
    <h1>多人聊天室</h1>
    <p class="sub">在线版 · 无需安装 · 打开即聊</p>
    <label>昵称</label>
    <input id="nickInput" maxlength="20" placeholder="给自己起个名字（20字以内）">
    <label>房间号</label>
    <input id="roomInput" maxlength="12" value="8888" placeholder="填相同的房间号即可一起聊天">
    <label>管理员密码（普通聊天者请留空）</label>
    <input id="pwdInput" type="password" placeholder="留空则以普通身份进入">
    <button id="loginBtn">进入聊天室</button>
    <div id="loginError"></div>
    <div class="tip">管理员默认密码：123456<br>把网址发给朋友，填同一个房间号即可一起聊</div>
  </div>
</div>

<!-- 聊天页 -->
<div id="chatPage">
  <div class="layout">
    <div class="sidebar">
      <div class="brand">多人聊天室<small>在线版 · 房间 <span id="roomLabel">-</span></small></div>
      <div class="sec-title">在线用户（<span id="userCount">0</span>）</div>
      <div class="user-list" id="userList"></div>
      <div class="foot">当前身份：<span id="myRole">-</span><br>公共服务，请勿发送敏感信息</div>
    </div>

    <div class="main">
      <div class="chat-header">
        <h2 id="chatTitle">聊天大厅</h2>
        <span class="role-chip" id="roleChip">-</span>
        <div class="conn"><span class="dot" id="connDot"></span><span id="connText">连接中…</span></div>
        <button class="btn btn-orange" id="announceBtn" style="display:none">发公告</button>
        <button class="btn btn-ghost" id="logoutBtn">退出</button>
      </div>

      <div id="prvBar">
        <span>正在与 <b id="prvTarget"></b> 私聊，消息只有你们俩能看到</span>
        <button class="btn btn-ghost" id="cancelPrv">取消私聊</button>
      </div>

      <div class="messages" id="msgBox"></div>

      <div id="adminBar">
        正在对 <b id="adminTarget"></b> 操作：
        <button class="btn btn-blue"  id="kickBtn">踢出</button>
        <button class="btn btn-red"   id="muteBtn">禁言</button>
        <button class="btn btn-green" id="unmuteBtn">解除禁言</button>
        <button class="btn btn-ghost" id="closeAdminBar">取消</button>
      </div>

      <div class="input-bar">
        <input id="msgInput" maxlength="500" placeholder="输入消息，回车发送…（提示：/to 昵称 内容 可私聊）">
        <button class="btn btn-blue" id="sendBtn">发送</button>
      </div>
    </div>
  </div>
</div>

<script src="mqtt.min.js"></script>
<script>
/* =========================================================
 * 纯静态在线聊天室 —— 无需后端服务器
 * 数据通道: 免费公共 MQTT Broker (WebSocket)
 * ========================================================= */

var BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt'
];
var ADMIN_PWD = '123456';          // 管理员密码(仅前端校验)
var BEAT_MS = 8000;                // 心跳间隔
var STALE_MS = 25000;              // 用户超时下线

var S = {
  room: '8888', nick: '', admin: false, muted: false,
  prvTo: null, adminTarget: null,
  client: null, brokerIdx: 0, connected: false,
  users: {},          // nick -> {lastSeen, admin, muted}
  joined: false
};

var $ = function (id) { return document.getElementById(id); };

/* ---------- 频道名 ---------- */
function baseTopic() { return 'wbchat/' + S.room; }

/* ---------- 登录 ---------- */
function showLogin(msg) {
  cleanup(true);
  $('chatPage').style.display = 'none';
  $('loginPage').style.display = 'flex';
  $('loginError').textContent = msg || '';
  $('loginBtn').disabled = false;
  $('loginBtn').textContent = '进入聊天室';
}

function setConn(state) {
  var dot = $('connDot'), txt = $('connText');
  if (state === 'on')  { dot.className = 'dot on';  txt.textContent = '已连接'; }
  if (state === 'off') { dot.className = 'dot off'; txt.textContent = '连接断开'; }
  if (state === 'ing') { dot.className = 'dot';     txt.textContent = '连接中…'; }
}

function doLogin() {
  var nick = $('nickInput').value.trim();
  var room = $('roomInput').value.trim();
  var pwd  = $('pwdInput').value;

  if (!nick) { $('loginError').textContent = '请输入昵称'; return; }
  if (nick.indexOf('|') >= 0) { $('loginError').textContent = '昵称不能包含 | 字符'; return; }
  if (!/^[A-Za-z0-9_\-]{1,12}$/.test(room)) {
    $('loginError').textContent = '房间号只能是 1~12 位字母、数字、下划线或横线';
    return;
  }
  if (pwd !== '' && pwd !== ADMIN_PWD) { $('loginError').textContent = '管理员密码错误'; return; }

  S.nick = nick; S.room = room; S.admin = (pwd !== ''); S.muted = false;
  S.users = {}; S.prvTo = null; S.adminTarget = null;

  $('loginError').textContent = '';
  $('loginBtn').disabled = true;
  $('loginBtn').textContent = '连接中…';

  localStorage.setItem('chat_nick', nick);
  localStorage.setItem('chat_room', room);

  $('loginPage').style.display = 'none';
  $('chatPage').style.display = 'block';
  $('msgBox').innerHTML = '';
  $('roomLabel').textContent = room;
  $('chatTitle').textContent = '聊天大厅 · 我的昵称：' + nick;
  $('myRole').textContent = nick + (S.admin ? '（管理员）' : '（聊天者）');
  $('roleChip').textContent = S.admin ? '管理员' : '聊天者';
  $('roleChip').className = 'role-chip ' + (S.admin ? 'admin' : 'user');
  $('announceBtn').style.display = S.admin ? '' : 'none';
  setConn('ing');
  connectBroker();
}

/* ---------- MQTT 连接 ---------- */
function connectBroker() {
  var url = BROKERS[S.brokerIdx];
  var clientId = 'wb_' + Math.random().toString(16).slice(2, 10);
  var client = mqtt.connect(url, {
    clientId: clientId,
    clean: true,
    keepalive: 30,
    connectTimeout: 8000,
    reconnectPeriod: 4000
  });
  S.client = client;
  var firstConnect = true;

  client.on('connect', function () {
    S.connected = true;
    setConn('on');
    firstConnect = false;

    var b = baseTopic();
    client.subscribe([
      b + '/msg', b + '/presence', b + '/announce', b + '/cmd',
      b + '/u/' + S.nick
    ], { qos: 0 });

    publishPresence('join');
    startBeat();
    addSysLine('已进入房间 ' + S.room + '，把网址发给朋友，填相同房间号即可一起聊');
    scrollBottom();
  });

  client.on('message', function (topic, payload) {
    var m;
    try { m = JSON.parse(payload.toString()); } catch (e) { return; }
    var b = baseTopic();
    if (topic === b + '/msg')            onPubMsg(m);
    else if (topic === b + '/presence')  onPresence(m);
    else if (topic === b + '/announce')  onAnnounce(m);
    else if (topic === b + '/cmd')       onCmd(m);
    else if (topic === b + '/u/' + S.nick) onPrivate(m);
  });

  client.on('close', function () { S.connected = false; setConn('off'); });
  client.on('offline', function () { S.connected = false; setConn('off'); });

  client.on('error', function () {
    if (firstConnect) {
      // 连不上当前 broker, 尝试下一个
      try { client.end(true); } catch (e) {}
      S.brokerIdx = (S.brokerIdx + 1) % BROKERS.length;
      setTimeout(connectBroker, 300);
    }
  });
}

function publish(topic, obj) {
  if (S.client && S.connected) S.client.publish(topic, JSON.stringify(obj), { qos: 0 });
}

/* ---------- 在线状态 ---------- */
var beatTimer = null, staleTimer = null;

function publishPresence(kind) {
  publish(baseTopic() + '/presence', {
    t: kind, nick: S.nick, admin: S.admin, time: Date.now()
  });
}

function startBeat() {
  if (beatTimer) clearInterval(beatTimer);
  publishPresence('join');
  beatTimer = setInterval(function () { publishPresence('beat'); }, BEAT_MS);

  if (staleTimer) clearInterval(staleTimer);
  staleTimer = setInterval(function () {
    var now = Date.now(), changed = false;
    for (var n in S.users) {
      if (now - S.users[n].lastSeen > STALE_MS) { delete S.users[n]; changed = true; }
    }
    if (changed) renderUsers();
  }, 5000);

  window.addEventListener('beforeunload', function () { publishPresence('leave'); });
}

function onPresence(m) {
  if (!m.nick || m.nick === S.nick) return;
  if (m.t === 'leave') {
    if (S.users[m.nick]) {
      delete S.users[m.nick];
      addSysLine('用户 "' + m.nick + '" 离开了聊天室');
      renderUsers(); scrollBottom();
    }
    return;
  }
  var isNew = !S.users[m.nick];
  S.users[m.nick] = { lastSeen: Date.now(), admin: !!m.admin, muted: (S.users[m.nick] || {}).muted || false };
  if (isNew) {
    addSysLine('用户 "' + m.nick + (m.admin ? '（管理员）' : '') + '" 进入了聊天室');
    scrollBottom();
    publishPresence('beat');     // 让新人也看到我
  }
  renderUsers();
}

/* ---------- 消息 ---------- */
function onPubMsg(m) {
  if (!m.from || m.text == null) return;
  renderMsg({ type: 'msg', from: m.from, text: m.text, time: m.time });
  scrollBottom();
}

function onPrivate(m) {
  if (!m.from || m.text == null) return;
  renderMsg({ type: 'prv', from: m.from, text: m.text, time: m.time });
  scrollBottom();
}

function onAnnounce(m) {
  addSysLine('【管理员公告】' + m.text, true);
  scrollBottom();
}

function onCmd(m) {
  if (m.target !== S.nick) return;
  if (m.action === 'kick') {
    alert('你已被管理员移出聊天室');
    cleanup(true);
    showLogin('你已被管理员移出聊天室');
  } else if (m.action === 'mute') {
    S.muted = true;
    $('msgInput').disabled = true;
    $('msgInput').placeholder = '你已被管理员禁言，暂时无法发言';
    addSysLine('你已被管理员禁言，暂时无法发言');
    scrollBottom();
  } else if (m.action === 'unmute') {
    S.muted = false;
    $('msgInput').disabled = false;
    $('msgInput').placeholder = '输入消息，回车发送…（提示：/to 昵称 内容 可私聊）';
    addSysLine('你已被解除禁言，欢迎继续发言');
    scrollBottom();
  }
}

/* ---------- 渲染 ---------- */
function colorOf(nick) {
  var colors = ['#1a73e8', '#43a047', '#8e24aa', '#e67e22', '#00897b', '#d81b60', '#5e35b1', '#6d4c41'];
  var h = 0;
  for (var i = 0; i < nick.length; i++) h = (h * 31 + nick.charCodeAt(i)) >>> 0;
  return colors[h % colors.length];
}

function nowTime() {
  var d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function renderMsg(m) {
  var isPrv = (m.type === 'prv');
  var isMine = (m.type === 'msg' && m.from === S.nick) || m.type === 'prv_echo';
  var name = m.type === 'prv_echo' ? ('我 → ' + m.to + '（私聊）')
           : isPrv ? (m.from + '（私聊）')
           : m.from;

  var row = document.createElement('div');
  row.className = 'msg' + (isMine ? ' mine' : '');

  var av = document.createElement('div');
  av.className = 'm-avatar';
  av.style.background = colorOf(isMine ? S.nick : m.from);
  av.textContent = (isMine ? S.nick : m.from).charAt(0);

  var body = document.createElement('div');
  body.className = 'm-body';
  var meta = document.createElement('div');
  meta.className = 'm-meta';
  meta.textContent = name + '  ' + (m.time || nowTime());
  var bub = document.createElement('div');
  bub.className = 'm-bubble' + (isPrv || m.type === 'prv_echo' ? ' prv' : '');
  bub.textContent = m.text;

  body.appendChild(meta); body.appendChild(bub);
  row.appendChild(av); row.appendChild(body);
  $('msgBox').appendChild(row);
}

function addSysLine(text, announce) {
  var d = document.createElement('div');
  d.className = 'sys-line' + (announce ? ' announce' : '');
  var s = document.createElement('span');
  s.textContent = text;
  d.appendChild(s);
  $('msgBox').appendChild(d);
}

function renderUsers() {
  var list = Object.keys(S.users).map(function (n) {
    return { nick: n, admin: S.users[n].admin, muted: S.users[n].muted };
  });
  list.push({ nick: S.nick, admin: S.admin, muted: S.muted });
  list.sort(function (a, b) {
    if (a.admin !== b.admin) return a.admin ? -1 : 1;
    return a.nick.localeCompare(b.nick, 'zh');
  });

  $('userCount').textContent = list.length;
  var box = $('userList');
  box.innerHTML = '';

  list.forEach(function (u) {
    var item = document.createElement('div');
    item.className = 'user-item';
    if (S.adminTarget === u.nick) item.classList.add('selected');

    var av = document.createElement('div');
    av.className = 'avatar';
    av.style.background = colorOf(u.nick);
    av.textContent = u.nick.charAt(0);

    var name = document.createElement('span');
    name.className = 'u-name';
    name.textContent = u.nick;

    item.appendChild(av); item.appendChild(name);

    if (u.nick === S.nick) {
      var b0 = document.createElement('span'); b0.className = 'badge me-b'; b0.textContent = '我';
      item.appendChild(b0);
    }
    if (u.admin) {
      var b1 = document.createElement('span'); b1.className = 'badge admin-b'; b1.textContent = '管理员';
      item.appendChild(b1);
    }
    if (u.muted) {
      var b2 = document.createElement('span'); b2.className = 'badge mute-b'; b2.textContent = '禁言中';
      item.appendChild(b2);
    }
    item.onclick = function () { pickUser(u); };
    box.appendChild(item);
  });
}

function scrollBottom() {
  var box = $('msgBox');
  box.scrollTop = box.scrollHeight;
}

/* ---------- 用户选择 ---------- */
function pickUser(u) {
  if (u.nick === S.nick) { exitPrv(); closeAdminBar(); return; }
  S.prvTo = u.nick;
  S.adminTarget = u.nick;
  $('prvTarget').textContent = u.nick;
  $('prvBar').style.display = 'flex';
  $('adminTarget').textContent = u.nick;
  $('adminBar').style.display = (S.admin && !u.admin) ? 'flex' : 'none';
  $('msgInput').focus();
  renderUsers();
}

function exitPrv() { S.prvTo = null; $('prvBar').style.display = 'none'; renderUsers(); }
function closeAdminBar() { S.adminTarget = null; $('adminBar').style.display = 'none'; renderUsers(); }

/* ---------- 发送 ---------- */
function sendMsg() {
  var input = $('msgInput');
  var text = input.value.trim();
  if (!text) return;
  if (!S.connected) { addSysLine('尚未连接服务器，请稍候…'); scrollBottom(); return; }
  input.value = '';

  var to = S.prvTo;
  if (text.indexOf('/to ') === 0) {
    var rest = text.slice(4), sp = rest.indexOf(' ');
    if (sp > 0) { to = rest.slice(0, sp); text = rest.slice(sp + 1); }
  } else if (text.charAt(0) === '@') {
    var r2 = text.slice(1), sp2 = r2.indexOf(' ');
    if (sp2 > 0) { to = r2.slice(0, sp2); text = r2.slice(sp2 + 1); }
  }
  if (!text) return;

  if (to) {
    if (to === S.nick) { addSysLine('不能给自己发私聊'); scrollBottom(); return; }
    if (!S.users[to]) { addSysLine('用户 "' + to + '" 不在线，私聊未送达'); scrollBottom(); return; }
    publish(baseTopic() + '/u/' + to, { from: S.nick, to: to, text: text, time: nowTime() });
    renderMsg({ type: 'prv_echo', from: S.nick, to: to, text: text, time: nowTime() });
  } else {
    publish(baseTopic() + '/msg', { from: S.nick, text: text, time: nowTime() });
  }
  scrollBottom();
}

/* ---------- 管理员 ---------- */
function adminAction(action) {
  if (!S.adminTarget) return;
  publish(baseTopic() + '/cmd', { action: action, target: S.adminTarget, from: S.nick });
  if (action === 'mute') {
    if (S.users[S.adminTarget]) S.users[S.adminTarget].muted = true;
    addSysLine('已禁言 "' + S.adminTarget + '"');
  } else if (action === 'unmute') {
    if (S.users[S.adminTarget]) S.users[S.adminTarget].muted = false;
    addSysLine('已解除 "' + S.adminTarget + '" 的禁言');
  } else if (action === 'kick') {
    addSysLine('已将 "' + S.adminTarget + '" 移出聊天室');
    delete S.users[S.adminTarget];
  }
  closeAdminBar();
  scrollBottom();
}

/* ---------- 清理 ---------- */
function cleanup(silent) {
  if (beatTimer) { clearInterval(beatTimer); beatTimer = null; }
  if (staleTimer) { clearInterval(staleTimer); staleTimer = null; }
  if (S.client) {
    if (!silent) publishPresence('leave');
    try { S.client.end(true); } catch (e) {}
    S.client = null;
  }
  S.connected = false;
  S.users = {};
  S.prvTo = null; S.adminTarget = null;
  $('prvBar').style.display = 'none';
  $('adminBar').style.display = 'none';
}

/* ---------- 事件 ---------- */
$('loginBtn').onclick = doLogin;
['nickInput', 'roomInput', 'pwdInput'].forEach(function (id) {
  $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
});
$('sendBtn').onclick = sendMsg;
$('msgInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendMsg(); });
$('cancelPrv').onclick = exitPrv;
$('logoutBtn').onclick = function () { cleanup(false); showLogin('已退出聊天室'); };
$('kickBtn').onclick = function () { if (confirm('确定踢出 "' + S.adminTarget + '" 吗？')) adminAction('kick'); };
$('muteBtn').onclick = function () { adminAction('mute'); };
$('unmuteBtn').onclick = function () { adminAction('unmute'); };
$('closeAdminBar').onclick = closeAdminBar;
$('announceBtn').onclick = function () {
  var t = prompt('请输入要发布的公告内容：');
  if (t && t.trim()) publish(baseTopic() + '/announce', { text: t.trim(), from: S.nick });
};

/* ---------- 恢复上次填写 ---------- */
(function () {
  var n = localStorage.getItem('chat_nick'), r = localStorage.getItem('chat_room');
  if (n) $('nickInput').value = n;
  if (r) $('roomInput').value = r;
})();
</script>
</body>
